[package]
name = "hardware-candlestick"
version = "0.1.0"
edition = "2021"
authors = ["LosChickenMan <ismail@example.com>"]
description = "Professional hardware performance terminal - Visualize system metrics as stock market candles"
license = "MIT"
repository = "https://github.com/LosChickenMan/stock-price-ascii"

[dependencies]
# Random number generation for price volatility
rand = "0.8"

# Error handling  
anyhow = "1.0"

[[bin]]
name = "hardware-candlestick"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
