[package]
name = "hardware-candlestick"
version = "0.2.0"
edition = "2021"
description = "A live terminal candlestick dashboard powered by system hardware metrics"

[[bin]]
name = "hardware-candlestick"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock"] }
crossterm = "0.28"
rand = "0.8"
ratatui = "0.28"
serde = { version = "1.0", features = ["derive"] }
sysinfo = "0.30"
toml = "0.8"
